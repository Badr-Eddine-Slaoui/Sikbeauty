version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    container_name: back-end
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "5454:3000"
    volumes:
      # Persist uploaded product images and assets on the VPS host
      - ./server/uploads:/app/uploads
    env_file:
      - .env
      - ./server/.env
    environment:
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  app:
    container_name: next_app
    build:
      context: ./app
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: always
    ports:
      - "${PORT}:3000"
    env_file:
      - .env
      - ./app/.env
    environment:
      - NODE_ENV=production
      # Internal API host URL for Next.js SSR / server-side fetches
      - INTERNAL_API_URL=http://back-end:3000/api/v1
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db

volumes:
  pg_data:
