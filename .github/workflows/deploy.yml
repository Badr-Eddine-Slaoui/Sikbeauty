name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Deployment on Hostinger VPS..."
            
            # Navigate to project directory
            cd /var/www/sikbeauty-next

            # Configure Git to use SSH for this session
            echo "🔑 Configuring SSH..."
            eval "$(ssh-agent -s)"

            # Add SSH key to SSH agent
            echo "🔑 Adding SSH key..."
            ssh-add /root/.ssh/sikbeauty
            
            # Pull latest changes from git
            echo "📥 Fetching latest changes..."
            git pull origin main
            
            # Detect Docker Compose version and apply workarounds for legacy bugs
            if docker compose version >/dev/null 2>&1; then
              echo "✅ Modern 'docker compose' (V2) detected."
              COMPOSE_CMD="docker compose"
            else
              echo "⚠️ Legacy 'docker-compose' (V1) detected. Applying cleanup to prevent ContainerConfig bugs..."
              COMPOSE_CMD="docker-compose"
              # Stop and remove existing containers to bypass the legacy KeyError: 'ContainerConfig' bug
              $COMPOSE_CMD -f docker-compose.prod.yml down
            fi

            # Build and recreate containers seamlessly (retains all volume data)
            echo "🐳 Rebuilding and upgrading Docker containers..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --build --remove-orphans
            
            # Run database migrations inside the server container
            # The '-T' flag is critical in CI/CD to disable pseudo-TTY allocation
            echo "🗄️ Running database migrations..."
            $COMPOSE_CMD -f docker-compose.prod.yml exec -T server npx prisma migrate deploy
            
            # Clean up old unused Docker images to save VPS disk space
            echo "🧹 Cleaning up system memory and old Docker layers..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
